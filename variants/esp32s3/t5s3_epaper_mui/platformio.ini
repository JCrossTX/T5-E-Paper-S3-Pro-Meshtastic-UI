; device-ui (MUI) at 540x960 portrait on the factory epdiy display stack
[env:t5s3-epaper-mui]
extends = t5s3_epaper_base
board_level = extra

build_unflags =
  -D PRIVATE_HW

build_flags =
  ; this variant's headers shadow the base variant's copies
  -I variants/esp32s3/t5s3_epaper_mui
  ${t5s3_epaper_base.build_flags}
  -D T5_S3_EPAPER_PRO_V2
  -D SDCARD_USE_SPI1
  ; as a flag: device-ui's SdCard.h needs it at header-parse time
  -D HAS_SDCARD=1
  -D GPS_POWER_TOGGLE

  ; device-ui / MUI
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D VIEW_540x960
  -D MESHTASTIC_EXCLUDE_INKHUD
  -D USE_PACKET_API
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"

  ; board adapter the e-paper display driver is templated on (as TFT boards set LGFX_DRIVER)
  -D EINK_DRIVER=T5EpaperBoard

  ; 540x960 is the logical portrait orientation (EPD_ROT_INVERTED_PORTRAIT)
  -D T5_PORTRAIT_W=540
  -D T5_PORTRAIT_H=960
  -D DISPLAY_SIZE=540x960

  ; LVGL
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_CACHE_DEF_SIZE=0
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D LV_BUILD_TEST=0

  ; LVGL heap in KB, from PSRAM
  -D RAM_SIZE=2048

  ; the port ships its own font faces under generated/
  -D UI_FONT_CUSTOM=1

  ; touch is the only wired UI input
  -D INPUTDRIVER_BUTTON_TYPE=0

; this variant's variant.cpp replaces the base variant's copy
build_src_filter =
  ${t5s3_epaper_base.build_src_filter}
  -<../variants/esp32s3/t5s3_epaper>
  +<../variants/esp32s3/t5s3_epaper_mui/variant.cpp>

lib_deps =
  ${t5s3_epaper_base.lib_deps}
  ; epdiy 2.1.3 and the device-ui checkout carrying the 540x960 port, bundled
  ; in this variant folder
  symlink://variants/esp32s3/t5s3_epaper_mui/lib/epdiy-t5s3
  symlink://variants/esp32s3/t5s3_epaper_mui/lib/device-ui-t5s3

; FastEPD (via the base lib_deps) stays linked: upstream Screen.cpp references
; EInkParallelDisplay symbols on paths unreachable under displaymode COLOR
custom_sdkconfig =
  ${t5s3_epaper_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}
  ; epdiy's S3 LCD driver requires 64-byte data-cache lines
  # CONFIG_ESP32S3_DATA_CACHE_LINE_32B is not set
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
  CONFIG_ESP32S3_DATA_CACHE_LINE_SIZE=64

custom_meshtastic_has_mui = true
custom_meshtastic_has_ink_hud = false
custom_meshtastic_support_level = 2
